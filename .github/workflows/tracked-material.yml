name: Tracked material

# What the tracked files may not hold (tests/tracked_material.py): keys, dumps, the console maker's name as a word and
# the names of piracy sites. It reads every tracked file, documentation included, so it runs on every pull request,
# including those build.yml skips for touching only files no build or test reads. It needs Python and git only
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracked-material-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tracked-material:
    name: Tracked material
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Self-test, then the checkout
        run: |
          python3 tests/tracked_material.py --self-test
          python3 tests/tracked_material.py .
